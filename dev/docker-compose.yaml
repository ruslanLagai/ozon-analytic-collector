version: "3.9"
services:
  postgres:
    image: postgres:16.14-alpine3.23
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ozon-analytics
    volumes:
      - ozon-analytic-storage:/var/lib/postgresql/data
volumes:
  ozon-analytic-storage: